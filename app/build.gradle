plugins { id 'com.android.application' }

android {
    namespace 'com.notchpixel.island'
    compileSdk 34
    defaultConfig {
        applicationId 'com.notchpixel.island'
        minSdk 26
        targetSdk 34
        versionCode 25
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
